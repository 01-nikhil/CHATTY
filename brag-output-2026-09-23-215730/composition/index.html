<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Chatty — Launch Video</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        margin: 0;
        background: #090d16;
        color: #f8fafc;
        font-family: 'Inter', system-ui, sans-serif;
        overflow: hidden;
        width: 1920px;
        height: 1080px;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #090d16;
      }
      .clip {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="20"
    >
      <!-- Audio Elements -->
      <audio id="bgm" src="assets/music/bgm.mp3" data-start="0" data-duration="20" data-volume="0.35"></audio>
      <audio id="sfx-pop" src="assets/sfx/interface/bong_001.ogg" data-start="0.6" data-volume="0.6"></audio>
      <audio id="sfx-click1" src="assets/sfx/interface/click_001.ogg" data-start="4.8" data-volume="0.6"></audio>
      <audio id="sfx-click2" src="assets/sfx/interface/click_002.ogg" data-start="6.2" data-volume="0.6"></audio>
      <audio id="sfx-msg-in1" src="assets/sfx/interface/drop_001.ogg" data-start="8.2" data-volume="0.6"></audio>
      <audio id="sfx-msg-out" src="assets/sfx/interface/drop_002.ogg" data-start="9.6" data-volume="0.6"></audio>
      <audio id="sfx-msg-in2" src="assets/sfx/interface/drop_003.ogg" data-start="11.4" data-volume="0.6"></audio>
      <audio id="sfx-switch1" src="assets/sfx/interface/switch_001.ogg" data-start="14.0" data-volume="0.6"></audio>
      <audio id="sfx-switch2" src="assets/sfx/interface/switch_002.ogg" data-start="14.8" data-volume="0.6"></audio>
      <audio id="sfx-switch3" src="assets/sfx/interface/switch_004.ogg" data-start="15.6" data-volume="0.6"></audio>
      <audio id="sfx-switch4" src="assets/sfx/interface/switch_006.ogg" data-start="16.4" data-volume="0.6"></audio>

      <!-- Sub-Composition Clips -->
      <div
        id="scene-hook"
        class="clip"
        data-composition-id="scene-hook"
        data-composition-src="compositions/scene-hook.html"
        data-start="0"
        data-duration="3.5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="scene-login"
        class="clip"
        data-composition-id="scene-login"
        data-composition-src="compositions/scene-login.html"
        data-start="3.5"
        data-duration="4.0"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="scene-chat"
        class="clip"
        data-composition-id="scene-chat"
        data-composition-src="compositions/scene-chat.html"
        data-start="7.5"
        data-duration="6.0"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="scene-themes"
        class="clip"
        data-composition-id="scene-themes"
        data-composition-src="compositions/scene-themes.html"
        data-start="13.5"
        data-duration="4.0"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="scene-outro"
        class="clip"
        data-composition-id="scene-outro"
        data-composition-src="compositions/scene-outro.html"
        data-start="17.5"
        data-duration="2.5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
