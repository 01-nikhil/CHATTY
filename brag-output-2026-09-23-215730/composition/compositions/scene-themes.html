      <div id="root" data-composition-id="scene-themes" data-width="1920" data-height="1080">
        <div class="theme-title-box" id="theme-header">
          <h2 class="scene-heading">32 DaisyUI Color Themes</h2>
          <p class="tagline">Instant skin switching with full theme state persistence</p>

          <div class="sidebar">
            <div class="sidebar-header">
              <div class="user-avatar">🦊</div>

                <div class="contact-avatar">👩<div class="online-indicator"></div></div>

      <script>
        const tl = gsap.timeline({ paused: true });
        tl.from("#theme-header", { y: -20, opacity: 0, duration: 0.5, ease: "power3.out" }, 0.1);
        tl.from("#theme-app-window", { scale: 0.95, opacity: 0, duration: 0.5, ease: "power3.out" }, 0.2);
        tl.from("#pill-synthwave", { y: 20, opacity: 0, duration: 0.3 }, 0.5);

        // Switch to Cyberpunk at 1.3s
        tl.to("#theme-app-window", { className: "app-wrapper cyberpunk", duration: 0.1 }, 1.3);
        tl.from("#pill-cyberpunk", { y: 20, opacity: 0, duration: 0.3 }, 1.3);

        // Switch to Retro at 2.1s
        tl.to("#theme-app-window", { className: "app-wrapper retro", duration: 0.1 }, 2.1);
        tl.from("#pill-retro", { y: 20, opacity: 0, duration: 0.3 }, 2.1);

        // Switch to Dracula at 2.9s
        tl.to("#theme-app-window", { className: "app-wrapper dracula", duration: 0.1 }, 2.9);
        tl.from("#pill-dracula", { y: 20, opacity: 0, duration: 0.3 }, 2.9);

        tl.to("#root > *", { opacity: 0, duration: 0.4, ease: "power2.in" }, 3.5);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene-themes"] = tl;
      </script>
