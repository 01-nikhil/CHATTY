<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: #090d16;
          font-family: 'Inter', system-ui, sans-serif;
          color: #f8fafc;
        }
        .content {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 32px;
          z-index: 2;
        }
        .scene-heading {
          font-size: 48px;
          font-weight: 800;
          color: #f8fafc;
        }
        .login-card {
          width: 520px;
          background: #1e293b;
          border: 1px solid rgba(255, 255, 255, 0.1);
          border-radius: 24px;
          padding: 40px;
          box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
          display: flex;
          flex-direction: column;
          gap: 24px;
        }
        .avatar-selector {
          display: flex;
          justify-content: center;
          gap: 16px;
        }
        .avatar-option {
          width: 56px;
          height: 56px;
          border-radius: 50%;
          background: #334155;
          display: flex;
          align-items: center;
          justify-content: center;
          font-weight: 700;
          font-size: 20px;
          color: #cbd5e1;
          border: 2px solid transparent;
        }
        .avatar-option.active {
          border-color: #6366f1;
          box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
        }
        .input-group {
          display: flex;
          flex-direction: column;
          gap: 8px;
        }
        .input-group label {
          font-size: 16px;
          font-weight: 600;
          color: #94a3b8;
        }
        .input-field {
          width: 100%;
          height: 52px;
          background: #0f172a;
          border: 1px solid #334155;
          border-radius: 12px;
          padding: 0 16px;
          color: #f8fafc;
          font-size: 18px;
          outline: none;
        }
        .btn-primary {
          width: 100%;
          height: 56px;
          background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
          border: none;
          border-radius: 12px;
          color: white;
          font-size: 20px;
          font-weight: 700;
          cursor: pointer;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 10px;
          box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
        }
        .status-pill {
          display: flex;
          align-items: center;
          gap: 12px;
          padding: 12px 28px;
          background: rgba(16, 185, 129, 0.15);
          border: 1px solid rgba(16, 185, 129, 0.3);
          border-radius: 999px;
          color: #34d399;
          font-size: 22px;
          font-weight: 700;
        }
        .status-dot {
          width: 14px;
          height: 14px;
          border-radius: 50%;
          background: #10b981;
          box-shadow: 0 0 12px #10b981;
        }
      </style>

      <div id="root" data-composition-id="scene-login" data-width="1920" data-height="1080">
        <div class="content" id="login-content">
          <h2 class="scene-heading" id="login-heading">Instant & Secure Authentication</h2>
          <div class="login-card" id="login-card">
            <div class="avatar-selector">
              <div class="avatar-option">👤</div>
              <div class="avatar-option active">🦊</div>
              <div class="avatar-option">🚀</div>
              <div class="avatar-option">🐱</div>
            </div>
            <div class="input-group">
              <label>Email Address</label>
              <input type="text" class="input-field" value="john@example.com" readonly />
            </div>
            <div class="input-group">
              <label>Password</label>
              <input type="password" class="input-field" id="login-pass" value="••••••••••••" readonly />
            </div>
            <button class="btn-primary" id="login-btn">
              <span>Sign In to Chatty</span>
            </button>
          </div>
          <div class="status-pill" id="login-status">
            <div class="status-dot"></div>
            <span>Connected to Server • 4 Online Friends</span>
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        tl.from("#login-heading", { y: -30, opacity: 0, duration: 0.6, ease: "power3.out" }, 0.1);
        tl.from("#login-card", { y: 50, opacity: 0, scale: 0.95, duration: 0.8, ease: "power3.out" }, 0.3);
        tl.from("#login-status", { opacity: 0, scale: 0.8, duration: 0.5, ease: "back.out(1.5)" }, 2.3);
        tl.to("#login-btn", { scale: 1.05, duration: 0.2, yoyo: true, repeat: 1, ease: "power1.inOut" }, 2.7);
        tl.to("#login-content", { opacity: 0, scale: 0.95, duration: 0.5, ease: "power2.in" }, 3.5);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene-login"] = tl;
      </script>
    </template>
  </body>
</html>
